[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary_condition"
version = "0.1.0"
authors = [
  { name="Nicolas Zamorano", email="nicolas.zamo12@gmail.com" },
  { name="Ivan Bioli", email="ivan.bioli@unipv.it" }
]
description = "Boundary condition imposition for neural networks."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.0.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.60.0",
]

[project.urls]
Homepage = "https://github.com/Nicolas-Zamorano/boundary_condition"
Issues = "https://github.com/Nicolas-Zamorano/boundary_condition/issues"

